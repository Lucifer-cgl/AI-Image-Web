<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地图片生成</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4fa;color:#282338;font:16px/1.6 system-ui,sans-serif}main{max-width:980px;margin:28px auto;padding:28px;background:#fff;border-radius:20px;box-shadow:0 8px 35px #30205012}h1{margin:0 0 8px}h2{margin-top:0}p{color:#665e75;overflow-wrap:anywhere}label{display:block;margin:18px 0 6px;font-weight:650}textarea,select,input{font:inherit;width:100%;padding:12px;border:1px solid #d7d1e2;border-radius:10px}textarea{min-height:150px;resize:vertical}button,.download{display:inline-block;background:#7929d9;color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.secondary{background:#746d7e}.danger{background:#c23b52}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}.hint{font-size:14px}.error{color:#bd2037}.tabs{display:flex;gap:10px;margin:22px 0}.tabs button{flex:1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1;text-align:center;min-width:120px}.actions button,.actions .download{margin:0}#status{white-space:pre-wrap}.preview{max-width:100%;max-height:680px;display:block;margin-top:16px;border-radius:12px}#sourcePreview{max-height:360px;border:1px solid #e1dbe9}.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card{border:1px solid #e2dbea;border-radius:14px;padding:12px;background:#fff}.card img{width:100%;height:260px;object-fit:contain;background:#f3f1f6;border-radius:10px}.card p{font-size:13px;margin:6px 0}.prompt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:#383044!important}.empty{text-align:center;padding:48px 12px}.busy{display:inline-block;width:16px;height:16px;border:2px solid #ffffff80;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:650px){main{margin:0;padding:18px;border-radius:0}.card img{height:220px}}
</style>
<main>
<h1>本地图片生成</h1>
<p id="model">正在连接本机模型服务…</p>
<p class="hint">图片和历史记录只保存在这台电脑。首次生成需要加载模型，请勿同时启动多个生成任务。</p>
<div class="tabs"><button id="generateTabButton">生成图片</button><button id="historyTabButton" class="secondary">历史记录</button></div>
<section id="generateTab">
<form id="form">
<label for="prompt">画面描述</label><textarea id="prompt" required maxlength="6000" placeholder="可以输入中文或英文"></textarea>
<p class="hint">启用自动翻译后，中文会先由本机轻量模型翻译成英文，再交给 DreamShaper。</p>
<label><input id="autoTranslate" type="checkbox" checked style="width:auto;margin-right:8px">中文提示词自动翻译（本地运行）</label>
<p class="hint" id="translationStatus">正在检查翻译模型…</p>
<label for="sourceImage">上传原图（可选）</label><input id="sourceImage" type="file" accept="image/png,image/jpeg,image/webp">
<p class="hint">上传后为图生图，不上传为文生图；原图不会离开本机。</p>
<img id="sourcePreview" class="preview" hidden alt="待修改原图"><button id="clearSource" class="secondary" type="button" hidden>移除原图</button>
<div id="strengthOptions" hidden><label for="strength">修改强度：<span id="strengthValue">0.45</span></label><input id="strength" type="range" min="0.10" max="0.90" step="0.05" value="0.45"></div>
<label for="size">输出尺寸</label><select id="size">
<optgroup label="常用尺寸"><option>512x512</option><option>512x768</option><option>768x512</option><option>768x768</option><option>1024x1024</option></optgroup>
<optgroup label="横屏"><option>1280x720</option><option>1920x1080</option></optgroup>
<optgroup label="竖屏"><option>720x1280</option><option>1080x1920</option></optgroup>
</select>
<p class="hint">最长边超过 768 时先以安全尺寸生成，再使用 Lanczos 放大到所选尺寸。</p>
<label for="steps">采样步数</label><select id="steps"><option value="12">快速 · 12步</option><option value="20" selected>标准 · 20步</option><option value="28">精细 · 28步</option></select>
<label for="negative">不希望出现的内容（可选）</label><input id="negative" value="" placeholder="例如：blurry, watermark, text；留空则不附加">
<button id="generate" disabled>生成</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<img id="preview" class="preview" hidden alt="本地模型生成结果">
<div id="resultActions" class="actions" hidden><a id="download" class="download">下载图片</a><button id="openHistory" class="secondary" type="button">查看历史记录</button></div>
</section>
<section id="historyTab" hidden><div class="actions"><button id="refreshHistory" class="secondary">刷新历史记录</button></div><p id="historyStatus"></p><div id="historyList" class="history-grid"></div></section>
</main>
<script>
let initImageData='',latestHistory=null;
const el=id=>document.getElementById(id);
function showTab(name){el('generateTab').hidden=name!=='generate';el('historyTab').hidden=name!=='history';el('generateTabButton').className=name==='generate'?'':'secondary';el('historyTabButton').className=name==='history'?'':'secondary';if(name==='history')loadHistory()}
el('generateTabButton').onclick=()=>showTab('generate');el('historyTabButton').onclick=()=>showTab('history');el('openHistory').onclick=()=>showTab('history');el('refreshHistory').onclick=loadHistory;
async function setup(){try{const response=await fetch('/health');if(!response.ok)throw Error('无法读取服务状态');const info=await response.json();el('model').textContent='当前模型：'+info.model+(info.model_loaded?' · 已加载':' · 首次生成时加载');el('autoTranslate').disabled=!info.translation_available;el('autoTranslate').checked=!!info.translation_available;el('translationStatus').textContent=info.translation_available?'已安装本地翻译模型；只在检测到中文时运行。':'未安装本地翻译模型，请输入英文提示词。';el('generate').disabled=false}catch(error){fail(error.message)}}
el('strength').oninput=()=>el('strengthValue').textContent=Number(el('strength').value).toFixed(2);
el('sourceImage').onchange=()=>{const file=el('sourceImage').files?.[0];if(!file){clearSource();return}if(file.size>20*1024*1024){el('sourceImage').value='';fail('原图不能超过 20MB');return}const reader=new FileReader();reader.onload=()=>{initImageData=String(reader.result||'');el('sourcePreview').src=initImageData;el('sourcePreview').hidden=false;el('clearSource').hidden=false;el('strengthOptions').hidden=false;el('status').textContent='已选择原图，将使用图生图模式。'};reader.onerror=()=>fail('无法读取原图');reader.readAsDataURL(file)};
function clearSource(){initImageData='';el('sourceImage').value='';el('sourcePreview').removeAttribute('src');el('sourcePreview').hidden=true;el('clearSource').hidden=true;el('strengthOptions').hidden=true}el('clearSource').onclick=clearSource;
function fail(message){el('status').className='error';el('status').textContent=message}
el('form').onsubmit=async event=>{event.preventDefault();const button=el('generate');button.disabled=true;button.innerHTML='<span class="busy"></span>正在生成';el('status').className='';el('status').textContent='正在生成；首次运行需要把模型加载到显卡…';el('preview').hidden=true;el('resultActions').hidden=true;try{const body={prompt:el('prompt').value,size:el('size').value,negative_prompt:el('negative').value.trim(),auto_translate:el('autoTranslate').checked,steps:Number(el('steps').value),...(initImageData?{init_image:initImageData,strength:Number(el('strength').value)}:{})};const response=await fetch('/v1/images/generations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok){const detail=await response.text();let message=detail;try{const value=JSON.parse(detail);message=value.error?.message||value.error||detail}catch{}throw Error(String(message))}const data=await response.json(),item=data.data?.[0];if(!item?.b64_json)throw Error('模型没有返回图片');el('preview').src='data:image/png;base64,'+item.b64_json;el('preview').hidden=false;latestHistory=item.history;el('download').href=item.history.url+'?download=1';el('download').download=item.history.name;el('resultActions').hidden=false;el('status').textContent='生成完成，用时 '+item.inference_seconds+' 秒。'+(item.revised_prompt?'\n实际英文提示词：'+item.revised_prompt:'')}catch(error){fail('生成失败：'+error.message)}finally{button.disabled=false;button.textContent='生成'}};
async function loadHistory(){const list=el('historyList');list.replaceChildren();el('historyStatus').textContent='正在读取历史记录…';try{const response=await fetch('/api/history');if(!response.ok)throw Error('读取失败');const data=await response.json();el('historyStatus').textContent=data.items.length?'共 '+data.items.length+' 张图片':'暂无历史记录';if(!data.items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='生成的图片会自动出现在这里。';list.append(empty);return}for(const item of data.items)list.append(historyCard(item))}catch(error){el('historyStatus').className='error';el('historyStatus').textContent=error.message}}
function historyCard(item){const card=document.createElement('article');card.className='card';const image=document.createElement('img');image.src=item.url;image.loading='lazy';image.alt=item.prompt||'历史图片';const prompt=document.createElement('p');prompt.className='prompt';prompt.textContent=item.prompt||'未记录提示词';const meta=document.createElement('p');meta.textContent=(item.width&&item.height?item.width+'×'+item.height+' · ':'')+new Date(item.created_at).toLocaleString();const actions=document.createElement('div');actions.className='actions';const download=document.createElement('a');download.className='download';download.href=item.url+'?download=1';download.download=item.name;download.textContent='下载';const remove=document.createElement('button');remove.className='danger';remove.textContent='删除';remove.onclick=async()=>{if(!confirm('永久删除这张历史图片？'))return;remove.disabled=true;const response=await fetch('/api/history/'+encodeURIComponent(item.name),{method:'DELETE'});if(!response.ok){remove.disabled=false;alert('删除失败');return}card.remove();loadHistory()};actions.append(download,remove);card.append(image,prompt,meta,actions);return card}
setup();
</script>
</html>
